<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Pools Map & Submissions</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Estilo del Mapa */
    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }

    /* Botón flotante para abrir el formulario */
    .add-pool-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background-color: #007bff;
      color: #ffffff;
      padding: 14px 22px;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .add-pool-btn:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
    }

    /* Modal / Formulario Flotante */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 2000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-container {
      background-color: #313030;
      color: #ffffff;
      padding: 30px 35px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: #aaaaaa;
      font-size: 24px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    h2 {
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 22px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #e0e0e0;
      font-size: 13px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #4f4e4e;
      border-radius: 6px;
      background-color: #242323;
      color: #ffffff;
      font-size: 14px;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px dashed #555555;
      border-radius: 6px;
      background-color: #242323;
      color: #d0d0d0;
      cursor: pointer;
      font-size: 13px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #007bff;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .file-hint {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #aaaaaa;
    }

    .location-status {
      font-size: 12px;
      color: #00ff88;
      margin-bottom: 15px;
      font-weight: 600;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Botón superior -->
  <button class="add-pool-btn" id="openFormBtn">+ Add Marine Pool</button>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Formulario Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-container">
      <button class="close-btn" id="closeFormBtn">&times;</button>
      <h2>Add New Tidal / Marine Pool</h2>

      <form action="https://formsubmit.co/nareme12@gmail.com" method="POST" enctype="multipart/form-data">
        
        <!-- Desactivar Captcha de FormSubmit -->
        <input type="hidden" name="_captcha" value="false">

        <!-- Coordenadas calculadas automáticamente -->
        <input type="hidden" id="latitude" name="Latitude">
        <input type="hidden" id="longitude" name="Longitude">

        <div class="location-status" id="locationStatus">
          📍 Click on the map to set location coordinates.
        </div>

        <div class="form-group">
          <label for="pool_name">Tidal Pool Name *</label>
          <input type="text" id="pool_name" name="Tidal_Pool_Name" placeholder="e.g. Charco Azul" required>
        </div>

        <div class="form-group">
          <label for="acquisition_date">Acquisition / Observation Date *</label>
          <input type="date" id="acquisition_date" name="Acquisition_Date" required>
        </div>

        <div class="form-group">
          <label for="user_name">Your Name *</label>
          <input type="text" id="user_name" name="Contributor_Name" placeholder="Full name" required>
        </div>

        <div class="form-group">
          <label for="user_email">Your Email *</label>
          <input type="email" id="user_email" name="Contributor_Email" placeholder="your.email@example.com" required>
        </div>

        <div class="form-group">
          <label for="description">Description & Features *</label>
          <textarea id="description" name="Description_Features" placeholder="Depth, access, tide conditions, water clarity..." required></textarea>
        </div>

        <div class="form-group">
          <label for="attachment">Pool Photo (Optional)</label>
          <input type="file" id="attachment" name="attachment" accept=".jpg, .jpeg, .png">
          <span class="file-hint">Allowed formats: JPG, PNG</span>
        </div>

        <button type="submit">Submit for Review</button>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Inicializar el Mapa (Centrado en Canarias / España)
    const map = L.map('map').setView([28.291565, -16.629130], 9);

    // 2. Cargar Capa Satelital de Google Maps
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '© Google Maps'
    }).addTo(map);

    // Variables de control
    let selectedMarker = null;
    const modal = document.getElementById('formModal');
    const openBtn = document.getElementById('openFormBtn');
    const closeBtn = document.getElementById('closeFormBtn');
    const latInput = document.getElementById('latitude');
    const lngInput = document.getElementById('longitude');
    const locationStatus = document.getElementById('locationStatus');

    // Abrir modal
    openBtn.addEventListener('click', () => {
      modal.style.display = 'flex';
    });

    // Cerrar modal
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // 3. Capturar clic en el mapa para fijar el punto
    map.on('click', function(e) {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);

      // Actualizar inputs ocultos
      latInput.value = lat;
      lngInput.value = lng;

      // Mover o crear marcador visual
      if (selectedMarker) {
        selectedMarker.setLatLng(e.latlng);
      } else {
        selectedMarker = L.marker(e.latlng).addTo(map);
      }

      // Actualizar texto del modal y abrirlo
      locationStatus.innerHTML = `✅ Location Selected: Lat ${lat}, Lng ${lng}`;
      modal.style.display = 'flex';
    });
  </script>
</body>
</html>
